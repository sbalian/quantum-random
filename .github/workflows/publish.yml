name: Publish

on:
  push:
    tags:
      - "*"

jobs:
  release:
    permissions:
      id-token: write
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
      - name: Test import
        run: |
          for i in $(seq 1 10); do
            QRANDOM_API_KEY=key uv run --refresh --with "quantum-random==${GITHUB_REF_NAME#v}" --no-project -- python -c "import qrandom" && exit 0
            echo "Attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1
        shell: bash
